title: Project Manager
description: 'Git workbench for the Hermes Dashboard and Desktop: discovers the git repositories under the folders you watch, and inspects or changes them per file — stage, unstage, diff and discard — plus commit, push, pull, branches, commits and worktrees. Disclosure — reads the watch paths from its own SQLite table and git metadata (branch, remote, ahead/behind, commit subjects, status and diff text) from the repositories under them; file contents are read only as diff text returned to the requesting UI. Writes on request only: git add, commit, push, stash, fetch, merge --ff-only, restore, clean -f, and git worktree remove / switch through the worktree routes. Discard on a tracked file restores it from HEAD and drops the uncommitted edits; on a file in no commit (untracked or staged-new) it leaves the bytes on disk but nothing here can restore a version of it, and both sit behind a confirmation naming which one you are doing. No outbound network, no model call, no API keys; git fetch/push reach only the remote of the repository you are operating on.'
